name: Scheduled Release

# Publishes scheduled releases and deploys them to WordPress.org:
#   2026-10-20 -> 1.2.0
#   2026-10-30 -> 1.3.0
#   2026-11-10 -> 1.4.0
# GITHUB_TOKEN-created releases do not trigger other workflows, so the deploy
# workflow is called directly instead of relying on the "release published" event.

on:
  schedule:
    - cron: '0 6 20,30 10 *' # 06:00 UTC; guarded by the date map below.
    - cron: '0 6 10 11 *'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release now (e.g. 1.3.0)
        required: true
        type: string

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_deploy: ${{ steps.release.outputs.should_deploy }}
    steps:
      - name: Create release if due
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            case "$(date -u +%F)" in
              2026-10-20) TAG="1.2.0" ;;
              2026-10-30) TAG="1.3.0" ;;
              2026-11-10) TAG="1.4.0" ;;
              *) TAG="" ;;
            esac
          fi
          if [ -z "$TAG" ]; then
            echo "No release scheduled for today; skipping."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to WordPress.org
    needs: release
    if: needs.release.outputs.should_deploy == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-on-pushing-plugin.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
